name: PR Review Comment Classifier
on:
  pull_request_review_comment:
    types:
      - created
      - edited

permissions:
  pull-requests: write

jobs:
  review-comment-classifier:
    if: github.event.comment.user.login != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Validate Review Comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            /*************************************************************
             * CONTEXT
             *************************************************************/

            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const pullNumber =
              context.payload.pull_request.number;

            const comment =
              context.payload.comment;

            const commentId =
              comment.id;

            const reviewer =
              comment.user.login;

            const rawBody =
              comment.body || "";

            console.log("=================================");
            console.log("Comment ID :", commentId);
            console.log("Reviewer   :", reviewer);
            console.log("=================================");

            /*************************************************************
             * IGNORE REPLY COMMENTS
             *************************************************************/

            if (comment.in_reply_to_id != null) {
              console.log(
                `Reply detected (reply to ${comment.in_reply_to_id}). Workflow skipped.`
              );
              return;
            }

            /*************************************************************
             * NORMALIZE MARKDOWN
             *************************************************************/

            function normalizeComment(text){
              return text
                .replace(/<[^>]*>/g, " ")
                .replace(/[*_`>#-]/g, " ")
                .replace(/\r/g, " ")
                .replace(/\n/g, " ")
                .replace(/\s+/g, " ")
                .toUpperCase()
                .trim();
            }

            const normalized =
              normalizeComment(rawBody);

            console.log("Normalized Comment:");
            console.log(normalized);

            /*************************************************************
             * LABEL DEFINITIONS
             *************************************************************/

            const RANKING = [
              "MAJOR",
              "MINOR"
            ];

            const CLASSIFICATIONS = [
              "MISSING",
              "EXTRA/SUPERFLUOUS",
              "AMBIGUOUS",
              "INCONSISTENT",
              "IMPROVEMENT DESIRABLE",
              "NOT CONFORMING TO STANDARDS",
              "RISK-PRONE",
              "FACTUALLY INCORRECT",
              "NOT IMPLEMENTABLE",
              "EDITORIAL"
            ];

            /*************************************************************
             * EXTRACT REVIEW STATE
             *************************************************************/

            function extractState(text){
              const state = {
                type: null,
                ranking: null,
                classification: null
              };

              if(/\[QUESTION\]/i.test(text)){
                state.type = "QUESTION";
              }

              if(/\[DEFECT\]/i.test(text)){
                state.type = "DEFECT";
              }

              for(const ranking of RANKING){
                const regex =
                  new RegExp("\\[" + ranking + "\\]", "i");
                if(regex.test(text)){
                  state.ranking = ranking;
                  break;
                }
              }

              for(const classification of CLASSIFICATIONS){
                const escaped =
                  classification.replace("/", "\\/");
                const regex =
                  new RegExp("\\[" + escaped + "\\]", "i");
                if(regex.test(text)){
                  state.classification = classification;
                  break;
                }
              }

              return state;
            }

            const state =
              extractState(normalized);

            console.log("Detected State:");
            console.log(JSON.stringify(state, null, 2));

            /*************************************************************
             * UNIQUE MARKER
             *************************************************************/

            const marker =
              `<!-- review-classifier:${commentId} -->`;

            /*************************************************************
             * BOT REPLY MANAGER
             *************************************************************/

            async function findBotReply() {
              let page = 1;
              while (true) {
                const response =
                  await github.rest.pulls.listReviewComments({
                    owner,
                    repo,
                    pull_number: pullNumber,
                    per_page: 100,
                    page
                  });
                const existingReply =
                  response.data.find(reply =>
                    reply.user.login === "github-actions[bot]" &&
                    reply.body &&
                    reply.body.includes(marker)
                  );
                if (existingReply) {
                  console.log(`Existing bot reply found (${existingReply.id})`);
                  return existingReply;
                }
                if (response.data.length < 100) {
                  break;
                }
                page++;
              }
              console.log("No existing bot reply found.");
              return null;
            }

            async function createReply(message){
              console.log("Creating bot reminder...");
              await github.rest.pulls.createReplyForReviewComment({
                owner,
                repo,
                pull_number: pullNumber,
                comment_id: commentId,
                body: `${marker}\n${message}`
              });
            }

            async function updateReply(replyId, message){
              console.log(`Updating bot reminder ${replyId}`);
              await github.rest.pulls.updateReviewComment({
                owner,
                repo,
                comment_id: replyId,
                body: `${marker}\n${message}`
              });
            }

            async function deleteReply(replyId){
              console.log(`Deleting bot reminder ${replyId}`);
              await github.rest.pulls.deleteReviewComment({
                owner,
                repo,
                comment_id: replyId
              });
            }

            async function syncBotReply(message){
              const reminder = message.trim();
              const existingReply = await findBotReply();

              if(reminder.length === 0){
                if(existingReply){
                  await deleteReply(existingReply.id);
                }
                return;
              }

              if(existingReply){
                if(existingReply.body.includes(reminder)){
                  console.log("Reminder already up-to-date.");
                  return;
                }
                await updateReply(existingReply.id, reminder);
                return;
              }

              await createReply(reminder);
            }

            console.log("Bot Reply Manager initialized.");

            /*************************************************************
             * UI BUILDERS
             *************************************************************/

            function buildTypeTable() {
            return `👋 @${reviewer}

            Your review comment has not been classified yet.

            Please begin your review comment with **ONE** of the following labels.

            | Type | Description |
            |------|-------------|
            | \`**[QUESTION]**\` | Ask for clarification or raise a question |
            | \`**[DEFECT]**\` | Report a defect or issue |

            > **Note**
            >
            > If you choose **[DEFECT]**, you must also provide:
            >
            > - One **Ranking**
            > - One **Classification**
            `;
            }

            function buildRankingTable() {
            return `
            ## ❌ Ranking Required

            Choose exactly one.

            | Label | Meaning |
            |-------|---------|
            | \`🔴 **[MAJOR]**\` | Must be fixed before merge |
            | 🟡 **[MINOR]** | Small issue with lower impact |
            `;
            }

            function buildClassificationTable() {
            return `
            ## ❌ Classification Missing

            Choose exactly one.

            | Label | Meaning |
            |------|---------|
            | \`**[MISSING]**\` | Required code is missing |
            | \`**[EXTRA/SUPERFLUOUS]**\` | Unnecessary implementation |
            | \`**[AMBIGUOUS]**\` | Unclear implementation |
            | \`**[INCONSISTENT]**\` | Inconsistent behaviour |
            | \`**[IMPROVEMENT DESIRABLE]**\` | Improvement suggested |
            | \`**[NOT CONFORMING TO STANDARDS]**\` | Coding standard violation |
            | \`**[RISK-PRONE]**\` | Risky implementation |
            | \`**[FACTUALLY INCORRECT]**\` | Incorrect behaviour |
            | \`**[NOT IMPLEMENTABLE]**\` | Suggestion cannot be implemented |
            | \`**[EDITORIAL]**\` | Grammar / formatting issue |

            `;
            }

            function buildReminderHeader() {
            return `👋 @${reviewer}

            Your **[DEFECT]** review comment is not fully classified.

            `;
            }

            function buildFooter(state){
            return `
            ---

            ### Current Status

            | Requirement | Status |
            |-------------|--------|
            | Type | ✅ ${state.type} |
            | Ranking | ${state.ranking ? "✅ " + state.ranking : "❌ Missing"} |
            | Classification | ${state.classification ? "✅ " + state.classification : "❌ Missing"} |

            _Edit your review comment. This reminder will update automatically after every edit._
            `;
            }

            /*************************************************************
             * BUILD DYNAMIC REMINDER
             *************************************************************/

            function buildReminder(state){
              if(state.type === null){
                return buildTypeTable();
              }

              if(state.type === "QUESTION"){
                return "";
              }

              if(
                state.type === "DEFECT" &&
                state.ranking !== null &&
                state.classification !== null
              ){
                return "";
              }

              let reminder = buildReminderHeader();

              if(state.ranking === null){
                reminder += buildRankingTable();
              }

              if(state.classification === null){
                reminder += buildClassificationTable();
              }

              reminder += buildFooter(state);

              return reminder;
            }

            /*************************************************************
             * EXECUTION
             *************************************************************/

            const reminderMessage =
              buildReminder(state);

            await syncBotReply(reminderMessage);
